<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pictorial Translate - Image Text Translation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script
      async
      crossorigin="anonymous"
      data-clerk-publishable-key="pk_test_ZXhvdGljLXNjdWxwaW4tOTUuY2xlcmsuYWNjb3VudHMuZGV2JA"
      src="https://exotic-sculpin-95.clerk.accounts.dev/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
      type="text/javascript"
    ></script>
</head>
<body>
    <div class="background-glow"></div>

    <div class="container">
        <!-- Auth Section -->
        <div id="authContainer" style="display: none; text-align: center; padding: 2rem; margin-bottom: 2rem; background: rgba(255,255,255,0.05); border-radius: 12px;">
            <p style="color: var(--text-muted); margin-bottom: 1rem;">Please sign in to use Pictorial Translate</p>
            <button id="signInBtn" class="btn btn-primary" style="cursor: pointer;">Sign In</button>
        </div>

        <!-- Main App Section (hidden until auth) -->
        <div id="appContainer" style="display: none;">
        <!-- Header -->
        <header class="header">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <div>
                    <h1 class="title">Pictorial Translate</h1>
                    <p class="subtitle">Transform text in images, instantly</p>
                </div>
                <button id="signOutBtn" class="btn btn-secondary" style="cursor: pointer; white-space: nowrap;">Sign Out</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Upload Section -->
            <section class="upload-section">
                <div class="upload-card">
                    <div class="upload-zone" id="uploadZone">
                        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M12 2v20m-7-7l7-7 7 7M5 12h14" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <p class="upload-text">Drag & drop your image here</p>
                        <p class="upload-subtext">or click to select</p>
                        <input
                            type="file"
                            id="file"
                            class="file-input"
                            accept="image/*"
                            style="display: none;"
                        >
                    </div>
                </div>
            </section>

            <!-- Results Section -->
            <section class="results-section" id="resultsSection" style="display: none;">
                <div class="results-card">
                    <!-- Scanner Effect -->
                    <div class="scanner-container" id="scannerContainer">
                        <div class="scanner-line"></div>
                    </div>

                    <!-- Image Preview -->
                    <div class="results-grid">
                        <div class="result-column">
                            <h3 class="result-heading">Original Image</h3>
                            <div class="image-container">
                                <img id="image" class="preview-image" alt="Uploaded image">
                            </div>
                        </div>

                        <!-- Divider -->
                        <div class="divider"></div>

                        <!-- Translations -->
                        <div class="result-column">
                            <h3 class="result-heading">Translated Text</h3>
                            <div class="translations-container" id="translations">
                                <p class="loading-text">Processing...</p>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="button-group">
                        <button class="btn btn-primary" id="translateBtn">
                            <span class="btn-text">Translate</span>
                        </button>
                        <button class="btn btn-secondary" id="resetBtn">
                            <span class="btn-text">Upload New</span>
                        </button>
                    </div>
                </div>
            </section>

            <!-- Error Message -->
            <div class="error-message" id="errorMessage" style="display: none;"></div>
        </main>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
